<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simple Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .calculator {
      background: #ffffff;
      padding: 30px 25px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      width: 420px;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .calculator:hover {
      transform: translateY(-5px);
    }

    h2 {
      font-size: 28px;
      color: #2c3e50;
      margin-bottom: 25px;
      font-weight: 600;
    }

    .input-group {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    input[type="number"] {
      width: 48%;
      padding: 14px;
      font-size: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      text-align: center;
      transition: all 0.3s ease;
      background: #f8f9fa;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #3498db;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
    }

    input::placeholder {
      color: #95a5a6;
      font-style: italic;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 20px 0;
    }

    button {
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: white;
    }

    .op-btn {
      background: #3498db;
    }

    .op-btn:hover {
      background: #2980b9;
      transform: scale(1.05);
    }

    .clear-btn {
      background: #e74c3c;
      grid-column: span 4;
    }

    .clear-btn:hover {
      background: #c0392b;
    }

    #result {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      font-weight: 600;
      color: #2c3e50;
      background: #ecf0f1;
      border: 2px solid #bdc3c7;
      border-radius: 12px;
      margin-top: 15px;
      text-align: center;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #7f8c8d;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <h2>Simple Calculator</h2>

    <div class="input-group">
      <input type="number" id="num1" placeholder="NUMBER e.g. 1337" />
      <input type="number" id="num2" placeholder="NUMBER e.g. 2108" />
    </div>

    <div class="buttons">
      <button class="op-btn" onclick="calculate('+')">+ Add</button>
      <button class="op-btn" onclick="calculate('-')">- Subtract</button>
      <button class="op-btn" onclick="calculate('/')">/ Divide</button>
      <button class="op-btn" onclick="calculate('*')">× Multiply</button>
    </div>

    <div id="result">Result</div>

    <button class="clear-btn" onclick="clearResult()">Clear</button>

    <div class="footer">23CS2049 - Web Technology Lab</div>
  </div>

  <script>
    function calculate(op) {
      let n1 = parseFloat(document.getElementById("num1").value);
      let n2 = parseFloat(document.getElementById("num2").value);
      let resultText = "";

      if (isNaN(n1) || isNaN(n2)) {
        resultText = "Please enter valid numbers";
      } else {
        let result;
        switch (op) {
          case '+': result = n1 + n2; break;
          case '-': result = n1 - n2; break;
          case '*': result = n1 * n2; break;
          case '/':
            result = n2 !== 0 ? (n1 / n2).toFixed(4) : "Cannot divide by 0";
            break;
        }
        resultText = result;
      }

      document.getElementById("result").innerHTML = `<strong>${resultText}</strong>`;
    }

    function clearResult() {
      document.getElementById("num1").value = "";
      document.getElementById(" n2").value = "";
      document.getElementById("result").innerHTML = "Result";
    }

    // Optional: Auto-calculate on input change (bonus UX)
    document.getElementById("num1").addEventListener("input", () => {
      if (document.getElementById("num2").value) calculate('+'); // default to add
    });
    document.getElementById("num2").addEventListener("input", () => {
      if (document.getElementById("num1").value) calculate('+');
    });
  </script>

</body>
</html>
